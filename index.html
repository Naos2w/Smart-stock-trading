    <title>Smart Stock Trading</title>
    <!-- We keep Tailwind CDN for quick setup without complex postcss config files -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#007AFF', /* iOS Blue */
              secondary: '#8E8E93', /* iOS Gray */
              success: '#34C759', /* iOS Green */
              danger: '#FF3B30', /* iOS Red */
              dark: {
                bg: '#000000',
                surface: '#1C1C1E',
                grouped: '#F2F2F7'
              },
              light: {
                bg: '#F2F2F7',
                surface: '#FFFFFF'
              }
            },
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      /* iOS-like Scrollbar */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
    </style>
